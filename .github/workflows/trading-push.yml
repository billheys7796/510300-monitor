name: 510300 行情推送

on:
  schedule:
    # 每30分钟，周一至周五（全天触发，由脚本内 is_trading_time() 精确过滤 9:25-15:05 北京时间）
    - cron: '*/30 * * * 1-5'
  # 允许手动触发测试
  workflow_dispatch:
    inputs:
      force_push:
        description: '强制推送（忽略交易时间检查）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 获取行情并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push || 'false' }}
        run: python fetch_and_push.py
