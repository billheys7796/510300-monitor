name: 510300 行情推送

on:
  schedule:
    # +12小时修正：GitHub cron 存在12小时偏移，所有观察到的触发都在~12:30 UTC
    - cron: '30 13,14,15,17,18 * * 1-5'   # 预期触发 1:30,2:30,3:30,5:30,6:30 UTC
    - cron: '0 14,15,17,18,19 * * 1-5'     # 预期触发 2:00,3:00,5:00,6:00,7:00 UTC
  # 允许手动触发测试
  workflow_dispatch:
    inputs:
      force_push:
        description: '强制推送（忽略交易时间检查）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 获取行情并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push || 'false' }}
        run: python fetch_and_push.py
