name: 510300 行情推送

on:
  schedule:
    # 北京时间 9:30-15:00 每30分钟（UTC 1:30-7:00，周一至周五）
    # 使用显式时间避免 GitHub Cron 通配符兼容性问题
    - cron: '30 1,2,3,5,6 * * 1-5'   # 1:30,2:30,3:30,5:30,6:30 UTC
    - cron: '0 2,3,5,6,7 * * 1-5'     # 2:00,3:00,5:00,6:00,7:00 UTC
  # 允许手动触发测试
  workflow_dispatch:
    inputs:
      force_push:
        description: '强制推送（忽略交易时间检查）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 获取行情并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push || 'false' }}
        run: python fetch_and_push.py
